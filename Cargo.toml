[workspace]
resolver = "2"

members = [
  "odin_build",
  "odin_common",
  "odin_job",
  "odin_action",
  "odin_actor",
  "odin_macro",
  "odin_server",
  "odin_share",
  "odin_cesium",
  "odin_gdal",
  "odin_dem",
  "odin_hrrr",
  "odin_wind",
  "odin_geolayer",
  "odin_sentinel",
  "odin_goesr",
  "odin_orbital",
  "odin_adsb",
  "odin_n5",
  "odin_alertca",
  "odin_onnx",
  "odin_fires",
  "odin_himawari",
  "odin_image",
  "odin_openmeteo",
  "odin_wx",
  "odin_bushfire",
  "odin_fems",
  "odin_landfire",
  "odin_elmfire",
  "odin_nfdrs",

  "odin_live",
  "odin_live_aus",

  "gpshub",
  "mkslides",
  "servedoc",
  "webrun"
]

[workspace.dependencies]

odin_build  = { version = "*", path = "odin_build" }
odin_common = { version = "*", path = "odin_common" }
odin_macro  = { version = "*", path = "odin_macro" }
odin_gdal   = { version = "*", path = "odin_gdal" }
odin_action = { version = "*", path = "odin_action" }
odin_actor  = { version = "*", path = "odin_actor" }
odin_job    = { version = "*", path = "odin_job" }
odin_server = { version = "*", path = "odin_server" }
odin_share  = { version = "*", path = "odin_share" }
odin_cesium = { version = "*", path = "odin_cesium" }
odin_goesr  = { version = "*", path = "odin_goesr" }
odin_orbital = { version = "*", path = "odin_orbital" }
odin_sentinel = { version = "*", path = "odin_sentinel" }
odin_geolayer = { version = "*", path = "odin_geolayer" }
odin_hrrr   = { version = "*", path = "odin_hrrr" }
odin_dem    = { version = "*", path = "odin_dem" }
odin_wind   = { version = "*", path = "odin_wind" }
odin_adsb  = { version = "*", path = "odin_adsb" }
odin_n5     = { version = "*", path = "odin_n5" }
odin_alertca = { version = "*", path = "odin_alertca" }
odin_onnx = { version = "*", path = "odin_onnx" }
odin_fires = { version = "*", path = "odin_fires" }
odin_himawari = { version = "*", path = "odin_himawari" }
odin_image =  { version = "*", path = "odin_image" }
odin_openmeteo = { version = "*", path = "odin_openmeteo" }
odin_wx = { version = "*", path = "odin_wx" }
odin_bushfire = { version = "*", path = "odin_bushfire" }
odin_fems = {  version = "*", path = "odin_fems" }
odin_landfire = {  version = "*", path = "odin_landfire" }
odin_elmfire = { version = "*", path = "odin_elmfire" }
odin_nfdrs = { version = "*", path = "odin_nfdrs" }

# external crates for which we have to ensure the same version
axum = { version = "0.8", features = [ "http2", "ws", "macros"] }
axum-login = { version = "0.18" }
password-auth = { version = "1.0" }
passwords = { version = "3.1" }
#reqwest = { version = "0.13", features = ["json", "stream", "query"] }
#reqwest-middleware = { version = "0.5" }
reqwest = { version = "0.12", features = ["json", "stream"] } # http-cache-reqwest still depends on 0.12
reqwest-middleware = { version = "0.4" }
http-cache-reqwest = { version = "0.16" } # this still depends on reqwest 12.2
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tower-sessions = { version = "0.14.0", default-features = false, features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
sqlx = { version = "0.9", features = ["sqlite", "time", "runtime-tokio"] }
http = { version = "1.4" }
cacache = { version = "13.1" }
headers = { version = "0.4" }
url = { version = "2.5" }
bytes = { version = "1.11" }
futures = { version = "0.3" }
futures-util = { version = "0.3", features = ["sink"] }
async-trait = { version = "0.1" }
tokio = { version = "1.52", features = ["full", "tracing"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
#tokio-tungstenite = { version = "0.29.0", features = ["rustls"] } # this requires to explicitly handle certificates
tokio-util = { version = "0.7", features = ["full"] }
kanal = { version = "0.1", features = ["async"] } # TODO - do we want to promote this to workspace? What about flume?
rustls = { version = "0.23" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
serde_repr = { version = "0.1" }
serde_with = { version = "3.21" }
ron = { version = "0.12" }
csv = { version = "1.4" }
uom = { version = "0.38", features = ["serde", "f32", "i64", "autoconvert"] }
num = { version = "0.4.3" }
chrono = { version = "0.4", features = ["serde", "rkyv-64", "rkyv-validation"] }
chrono-tz = { version = "0.10", features = ["serde"] }
tzf-rs = { version = "1.3" }
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }
itertools = { version = "0.14" }
askama = { version = "0.16" }

#gdal = { version = "0.19", features = ["array", "bindgen"] }  # <<< reinstate when a new crate version is released
#gdal-sys = { version = "0.12", features = ["bindgen"]}        # <<< reinstate when a new crate version is released

# required as of 07-10-2026 because of GDAL 3.13 compatibility (crates.io version still at 0.19
gdal = { git = "https://github.com/georust/gdal.git", features = ["array", "bindgen"] }
gdal-sys = { git = "https://github.com/georust/gdal.git", features = ["bindgen"] }

# last acceptable fallback if GDAL compatibility patches haven't made it to upstream yet
#gdal = { path = "../patches/gdal", features = ["array","bindgen"]}
#gdal-sys = { path = "../patches/gdal/gdal-sys", features = ["bindgen"]}

geo = { version = "0.33" }
geo-types = { version = "0.7" }
geojson = { version = "1.0", features = ["geo-types"] }
wkt = { version = "0.14", features = ["serde"] }
nalgebra = { version = "0.35"}
lazy_static = { version = "1.5" }
paste = { version ="1.0" }
regex = { version = "1.12" }
hashbrown = { version = "0.17" }
bit-set = { version = "0.10", features = ["serde"] }
ndarray = { version = "0.17" }
interp = { version = "2.1" }
flate2 = { version = "1.1" }
miniz_oxide = { version = "0.9" }
memchr = { version = "2.8" }
clap = { version = "4.6", features = ["derive"]}
strum = { version = "0.28", features = ["derive"] }
derive_more = { version = "2.1", features = ["full"] }


dashmap = { version = "6.2" }
trait-set = { version = "0.3" } # remove when trait aliases become stabilized
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tracing = { version = "0.1"}
glob = { version = "0.3" }
globset = { version = "0.4" }
rand = { version = "0.10" }
zip = { version = "8.6"}
image = { version = "0.25" }
imageproc = { version = "0.27" }
kiddo = { version = "6.0", features = ["serde", "rkyv_08"] }

rkyv = { version = "0.8", features = ["bytecheck"]}  # use carefully as many crates don't support 0.8 yet (chrono, minify-html)
bytecheck = { version = "0.8" }

[profile.release]

codegen-units = 1
lto = "fat"
strip = "debuginfo"
