[package]
name = "odin_gdal"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "simplewarp"
path = "src/bin/simplewarp.rs"

[[bin]]
name = "utm_bbox"
path = "src/bin/utm_bbox.rs"

[[bin]]
name = "translate_bbox"
path = "src/bin/translate_bbox.rs"

[[bin]]
name = "crop_nodata"
path = "src/bin/crop_nodata.rs"

[dependencies]
gdal-sys = { workspace = true }
gdal = { workspace = true }

lazy_static = { workspace = true }
geo = {workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
bit-set = { workspace = true }
ndarray = { workspace = true }
trait-set = { workspace = true }
regex = { workspace = true }
num = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { workspace = true }
imageproc = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }

static_init = "1.0.4"
libc = "0.2.175"
meshgridrs = "0.1.1"
tdigest = "1.0"


odin_build = { workspace = true }
odin_common = { workspace = true }
odin_image = { workspace = true }
odin_server = { workspace = true }

[features]
## inline crate-specific resources (configs and assets) into the executable (see odin_build)
embedded_resources = []
trace_server = []
