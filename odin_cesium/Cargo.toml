[package]
name = "odin_cesium"
version = "0.5.0"
edition = "2024"

build = "../build_resources.rs"

[[bin]]
name = "basic_globe"
path = "src/bin/basic_globe.rs"

[[bin]]
name = "terrain_tiles"
path = "src/bin/terrain_tiles.rs"
required-features = ["terrain"]

[dependencies]
# our ODIN crates
odin_build = { workspace = true }
odin_actor = { workspace = true }
odin_common = { workspace = true, features = ["s3"] }
odin_macro = { workspace = true }
odin_server = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
lazy_static = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
zip = { workspace = true }

# optional local terrain (feature "terrain")
odin_gdal = { workspace = true, optional = true }
odin_dem = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[build-dependencies]
odin_build = { workspace = true }

[package.metadata.odin_assets]
odin_cesium_config = { file = "odin_cesium_config.js" }
odin_cesium = { file = "odin_cesium.js" }
view_icon = { file = "view.svg"}
time_icon = { file = "time.svg"}
layer_icon = { file = "layers.svg"}

imglayer_config = { file = "imglayer_config.js"}
imglayer = { file = "imglayer.js"}
imglayer_icon = { file = "imglayer.svg"}

[features]
default = ["cesium_proxy", "terrain"]

## serve local Cesium terrain tiles computed from a DEM VRT (see terrain.ron config). This adds a GDAL dependency
terrain = ["dep:odin_gdal", "dep:odin_dem", "dep:flate2", "dep:serde_json"]

trace_server = ["odin_server/trace_server"]
embedded_resources = []

cesium_external = []
cesium_proxy = []
cesium_asset = []